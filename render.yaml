services:
  - type: web
    name: finagent-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 1c-2g          # = "Standard" (2 GB RAM). Needed for TensorFlow. If Render rejects this ID, use: standard
    healthCheckPath: /api/stocks
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false