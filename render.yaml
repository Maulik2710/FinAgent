services:
  - type: web
    name: finagent-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter        # LSTM/TensorFlow needs more than the 512 MB free tier
    healthCheckPath: /api/stocks
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
